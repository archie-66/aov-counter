}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:10px 8px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}

h1 span{color:var(--gold)}
.search{display:flex;align-items:center;gap:8px;background:var(--seg);border-radius:11px;padding:0 10px;height:38px}
.search svg{flex:none;opacity:.55}
.search input{flex:1;min-width:0;border:0;background:none;font:16px var(--body);color:var(--fg);outline:none}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:2px;position:relative;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;font:500 14px var(--body);color:var(--fg);padding:6px 10px;border-radius:8px;position:relative;z-index:1;cursor:pointer;transition:color .2s}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:0;background:var(--seg-on);border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .35s var(--ease),width .35s var(--ease)}
.seg button[aria-selected="true"]{font-weight:700}
.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:14px 8px;padding-block:8px 32px;max-width:760px;margin:0 auto;box-sizing:border-box}
.hero{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--fg);font:500 13px var(--body);transition:transform .15s}
.hero{transition:opacity .25s ease-out;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hero.pressed{opacity:.4;transition:none}
.seg button,.back{transition:opacity .25s,color .2s;touch-action:manipulation}
.seg button.pressed,.back.pressed{opacity:.35;transition:none}
.seg button,.back{transition:opacity .15s,color .2s}
.hero:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}
.av{--c:var(--wr);width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font:900 26px var(--display);color:#fff;
  background:radial-gradient(120% 90% at 30% 15%,color-mix(in srgb,var(--c) 55%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000) 100%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 70%,transparent),0 3px 8px color-mix(in srgb,var(--c) 30%,transparent);text-shadow:0 1px 2px rgba(0,0,0,.35);position:relative;flex:none;overflow:hidden;transition:filter .2s}
.av svg{position:absolute;inset:0;width:100%;height:100%;fill:none}
.av b{position:relative;font-weight:900;line-height:1.05;text-align:center;letter-spacing:.02em;display:block;max-width:82%}
.av b.l1{font-size:1em}.av b.l2{font-size:.7em}.av b.l3{font-size:.54em}.av b.l4{font-size:.56em}.av b.l5{font-size:.46em}
.av,.av.sm,.av.lg{border-radius:50%;background:radial-gradient(120% 90% at 30% 15%,hsl(var(--h) var(--s) 60%) 0%,hsl(var(--h) var(--s) 40%) 58%,hsl(var(--h) var(--s) 22%) 100%);box-shadow:inset 0 0 0 2.5px var(--c),0 3px 8px hsl(var(--h) var(--s) 30% / .3)}
.av b{text-shadow:0 1px 3px rgba(0,0,0,.45)}
.el{display:inline-block;margin:8px 0 0 6px;font:700 12px var(--body);padding:3px 9px;border-radius:99px;background:var(--seg);color:var(--fg)}
.av.sm{width:48px;height:48px;border-radius:14px;font-size:21px}
.av.lg{width:96px;height:96px;border-radius:28px;font-size:44px}
.r-as{--c:var(--as)}.r-mg{--c:var(--mg)}.r-ad{--c:var(--ad)}.r-sp{--c:var(--sp)}.r-tk{--c:var(--tk)}.r-wr{--c:var(--wr)}
.hero .nm{max-width:76px;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
/* detail panels */
.panel{position:fixed;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .5s var(--ease);display:flex;flex-direction:column;z-index:20;box-shadow:-8px 0 30px rgba(0,0,0,.18);will-change:transform;touch-action:pan-y}
.panel.in{transform:translateX(0)}
.panel.under{transform:translateX(-28%)}
.panel.drag,.app.drag{transition:none}
.app{transition:transform .5s var(--ease),filter .5s var(--ease)}
.app.under{transform:translateX(-28%);filter:brightness(.92)}
.bar{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:6px;display:flex;align-items:center;min-height:44px}
.back{border:0;background:none;color:var(--gold);font:500 17px var(--body);display:flex;align-items:center;gap:2px;padding:6px 6px 6px 0;cursor:pointer}
.back:focus-visible{outline:2px solid var(--gold);border-radius:8px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.inner{max-width:640px;margin:0 auto;padding-block:4px 40px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:16px}
.top h2{font:900 30px var(--display);margin:0;letter-spacing:.03em}
.en{color:var(--muted);font-size:13px;margin-top:2px}
.chip{display:inline-block;margin-top:8px;font:700 12px var(--body);letter-spacing:.08em;padding:3px 9px;border-radius:99px;color:#fff;background:var(--c)}
.sect{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.sect h3{margin:0 0 4px;font:700 16px var(--body);display:flex;align-items:center;gap:8px}
.sect .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bad .dot{background:var(--bad)} .good .dot{background:var(--good)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 6px}
.list .hero .nm{font-size:12px}
.tag{font:700 10px var(--body);padding:1px 6px;border-radius:99px;margin-top:-2px}
.bad .tag{background:var(--bad-soft);color:var(--bad)} .good .tag{background:var(--good-soft);color:var(--good)}
.none{color:var(--muted);font-size:14px;padding:6px 0}
.src{font-size:12px;color:var(--muted);line-height:1.6}
.src b{color:var(--gold);font-weight:700}
.foot{max-width:760px;margin:0 auto;font-size:12px;color:var(--muted);padding-block:0 24px;text-align:center}

</style>

</head>

function setTab(i){

  const b=bs[i];thumb.style.width=b.offsetWidth+"px";thumb.style.transform=`translateX(${b.offsetLeft}px)`;
  b.scrollIntoView({block:"nearest",inline:"nearest"});
  try{localStorage.setItem("aov-tab",i)}catch(e){}
}

    <section class="sect bad"><h3><span class="dot"></span>被康特</h3><p class="hint">${esc(h.zh)}會被這些英雄康特，對面有的話要小心</p>
      ${h.by.length?`<div class="list">${h.by.map(id=>tile(BY[id],1)).join("")}</div>`:`<div class="none">還沒有資料</div>`}</section>
    <section class="sect good"><h3><span class="dot"></span>康特</h3><p class="hint">${esc(h.zh)}可以康特這些英雄，對面選了就能拿出來</p>
      ${h.beats.length?`<div class="list">${h.beats.map(id=>tile(BY[id],1)).join("")}</div>`:`<div class="none">資料中沒有被它康特的英雄</div>`}</section>
    <p class="src">資料來源：${srcTxt}。「康特」清單是反查所有英雄的資料得出。康特關係會隨版本改變，僅供參考。</p>
  </div></div>`;
}
function under(){return stack.length?stack[stack.length-1].el:app}
function push(id){
  const h=BY[id];if(!h)return;
  const el=document.createElement("div");el.className="panel";el.innerHTML=panelHTML(h);document.body.appendChild(el);
  const below=under();stack.push({el,zh:h.zh});
  el.getBoundingClientRect();
  requestAnimationFrame(()=>{el.classList.add("in");below.classList.add("under")});
  swipe(el);setTimeout(()=>el.querySelector(".back").focus({preventScroll:true}),450);
}
function pop(){
  const top=stack.pop();if(!top)return;const below=under();
  top.el.classList.remove("in","drag");top.el.style.transform="";below.classList.remove("under","drag");below.style.transform="";below.style.filter="";
  setTimeout(()=>top.el.remove(),500);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")pop()});
/* iOS-style press feedback */
let pr=null,px=0,py=0;
const unpress=()=>{if(pr){pr.classList.remove("pressed");pr=null}};
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".hero,.seg button,.back");if(!b)return;unpress();pr=b;px=e.clientX;py=e.clientY;b.classList.add("pressed");try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}} ,{passive:true});
document.addEventListener("pointermove",e=>{if(pr&&Math.hypot(e.clientX-px,e.clientY-py)>10)unpress()},{passive:true});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,unpress,{passive:true}));
document.addEventListener("scroll",unpress,{capture:true,passive:true});
function swipe(el){
  let x0=0,y0=0,dx=0,t0=0,on=false,locked=null,id=null;const W=()=>el.clientWidth;
  el.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;x0=e.clientX;y0=e.clientY;dx=0;t0=performance.now();on=true;locked=null;id=e.pointerId});
  el.addEventListener("pointermove",e=>{
    if(!on||e.pointerId!==id)return;const ddx=e.clientX-x0,ddy=e.clientY-y0;
    if(locked===null){if(Math.abs(ddx)<8&&Math.abs(ddy)<8)return;locked=ddx>0&&Math.abs(ddx)>Math.abs(ddy)*1.2;if(locked){el.setPointerCapture(id);el.classList.add("drag");under().classList.add("drag")}}
    if(!locked)return;e.preventDefault();dx=Math.max(0,ddx);
    el.style.transform=`translateX(${dx}px)`;const p=dx/W();const b=under();b.style.transform=`translateX(${-28*(1-p)}%)`;if(b===app)b.style.filter=`brightness(${.92+.08*p})`;
  });
  const end=e=>{
    if(!on||e.pointerId!==id)return;on=false;if(!locked)return;
    const v=dx/Math.max(1,performance.now()-t0);el.classList.remove("drag");const b=under();b.classList.remove("drag");
    if(dx>W()*.35||v>.6){pop()}else{el.style.transform="";b.style.transform="";b.style.filter=""}
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("click",e=>{if(locked&&dx>4){e.stopPropagation();e.preventDefault()}},true);
}
</script>
